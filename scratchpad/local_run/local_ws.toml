# Local Linux reproduction of the iter41 champion recipe (interleave + fine-to-coarse order).
# Clone of scratchpad/iter41_ilv/i41_ws.toml with only the save/validate paths changed for this
# machine (no F: drive; VALIDATE_DATASET_LMDB_PATH points at the locally-built test_db_5k_local).
TRAIN_USERS_START = 1
TRAIN_USERS_END = 5000

VALIDATE_USERS_START = 5001
VALIDATE_USERS_END = 5010

TRAIN_DATASET_LMDB_PATH = "train_db_5k_h1"
TRAIN_DATASET_LMDB_SIZE = 400_000_000_000
VALIDATE_DATASET_LMDB_PATH = "test_db_valprobe"
VALIDATE_DATASET_LMDB_SIZE = 20_000_000_000
LABEL_FILTER_LMDB_PATH = "label_filter_db"
LABEL_FILTER_LMDB_SIZE = 40_000_000_000

NUM_FETCH_PROCESSES = 2
MAX_TRAIN_GLOBAL_LEN = 65536

TRAIN_MODE = "WS"
STEP_OFFSET = 1
WARMUP_STEPS = 400
EPOCHS = 1
VALIDATE_EVERY = 1000
PEAK_LR = 1e-3

LOAD_MODEL = false
SAVE_MODEL_FOLDER = "scratchpad/local_run"
SAVE_MODEL_PREFIX = "local_ws"
DEVICE = "cuda"
DTYPE = "bfloat16"

USE_WANDB = false
WANDB_PROJECT_NAME = "rwkv"
WANDB_RESUME = false
WANDB_RESUME_ID = ""

# the FIRST iteration of the MERGED lineage -- the track-2 A18 champion trunk (d=80 = 5 heads
# x K=16, LoRA 4, 557,246 params, 4.95x below 2.76M) carrying the three track-1 ALGORITHMIC
# wins it never received: PAVA (iter 23) + GRU N=3 (iter 26) + Muon (iter 29). Arch module is

# BUDGET CALIBRATION arm c43 = the iter-43 recipe (interleave at the ORIGINAL order) at 1/3
# budget. Known full-budget result: a verified statistical TIE with c41 (p=0.42/0.098) -- so
# the |delta| this arm shows IS the short-budget noise floor. The most valuable of the three.
# run without reshaping the schedule; KD alpha is FIXED at 0.9, so the mix is undistorted too).
TRAIN_USERS_START = 1
TRAIN_USERS_END = 5000
VALIDATE_USERS_START = 5001
VALIDATE_USERS_END = 5010

TRAIN_DATASET_LMDB_PATH = "train_db_5k_h1"

# PROFILE-ONLY config: the iter-31 / A18 trunk recipe verbatim (MAX=32768, probe density 0.08),
# used with RWKV_PROFILE_STEP so torch.profiler wraps a few steady-state steps and exits.
# The last kernel profile was taken at d=32 / MAX=110000 and is two architectures stale; this
# re-measures the CURRENT d=80 trunk. Saves go to a scratch prefix so nothing real is touched
# (the trainer still force-saves at step 50 regardless of VALIDATE_EVERY).

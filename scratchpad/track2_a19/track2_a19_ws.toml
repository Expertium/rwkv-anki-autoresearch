# TRACK-2 A19: the A18 champion arch (d=80, 5 heads x K=16, LoRA 4) + the three track-1
# ALGORITHMIC wins it never received -- PAVA (iter 23) + GRU N=3 (iter 26) + Muon (iter 29).
# Arch module is A18's, unchanged: the only deltas are env flags, so params move by ~+966
# (one extra row in each of gru_w/s/d + 3 PAVA thetas).
# Gate = ordinary ACCURACY iter vs the A18 champion (NOT the ratio gate): both modes must
# improve >= 0.0001 after 4-dp rounding AND paired Wilcoxon p < 0.0001, on VAL 5001-7500.
# MAX_TRAIN_GLOBAL_LEN stays 32768 so the group sequence (22,346) and therefore the step
# pairing against A18's trace are identical; probe rows are inserted per-sample AFTER
# grouping, so they inflate row counts (~+30% worst case) without changing the step count.

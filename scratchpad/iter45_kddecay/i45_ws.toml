# ITER 45 = KD THROUGH THE DECAY PHASE, on the iter-41 CHAMPION recipe (2026-08-10).
# Clone of the champion WS toml with only the save prefix changed. The lever is entirely in
# the .cmd (RWKV_KD_MIX/ALPHA are NOT cleared before decay; alpha 0.9 -> 0.5 there) and needs
# ZERO code change. Data-affecting fields (db, users, MAX, fetch) MUST stay identical to the
# t128_seedpair_65k dump's, for BOTH phases now -- the decay phase newly consumes it too, and
# its per-step labels_sum checksum hard-exits 43 on any divergence.
TRAIN_USERS_START = 1
TRAIN_USERS_END = 5000
VALIDATE_USERS_START = 5001
VALIDATE_USERS_END = 5010

TRAIN_DATASET_LMDB_PATH = "train_db_5k_h1"
TRAIN_DATASET_LMDB_SIZE = 400_000_000_000
VALIDATE_DATASET_LMDB_PATH = "F:/rwkv_lmdb/test_db_5k"
VALIDATE_DATASET_LMDB_SIZE = 250_000_000_000
LABEL_FILTER_LMDB_PATH = "label_filter_db"
LABEL_FILTER_LMDB_SIZE = 40_000_000_000

NUM_FETCH_PROCESSES = 2
MAX_TRAIN_GLOBAL_LEN = 65536

TRAIN_MODE = "WS"
STEP_OFFSET = 1
WARMUP_STEPS = 400
EPOCHS = 1
VALIDATE_EVERY = 1000
PEAK_LR = 1e-3

LOAD_MODEL = false
SAVE_MODEL_FOLDER = "scratchpad/iter45_kddecay"

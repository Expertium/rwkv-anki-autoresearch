# ITER 53 = MUON ON THE EXCLUDED LoRA MATRICES (RWKV_MUON_INCLUDE_LORA=1), on the iter-45
# CHAMPION recipe. Clone of scratchpad/iter45_kddecay/i45_ws.toml with ONLY the save folder and
# prefix changed -- the lever is entirely in the .cmd's env.
# ⚠ Data-affecting fields (db, users, MAX_TRAIN_GLOBAL_LEN, fetch processes) MUST stay identical
# to the t128_seedpair_65k dump's: KD replays that dump by step index and its per-step labels_sum
# checksum hard-exits 43 on any divergence. Do not "tidy" them.
# (Written 2026-08-17: mk53.py generated the runner but never this file, so the WS phase would
# have died on a missing config. Same omission as iter 54's.)
TRAIN_USERS_START = 1
TRAIN_USERS_END = 5000
VALIDATE_USERS_START = 5001
VALIDATE_USERS_END = 5010

TRAIN_DATASET_LMDB_PATH = "train_db_5k_h1"
TRAIN_DATASET_LMDB_SIZE = 400_000_000_000

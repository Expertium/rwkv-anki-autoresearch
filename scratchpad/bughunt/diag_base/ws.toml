# DIAGNOSTIC WS phase for `base` -- generated by scratchpad/bughunt/mk_diag.py.
# EPOCHS 0.05 => ~546 steps. THIS RUN'S LOGLOSS IS MEANINGLESS; it exists to execute the path.
# Data-affecting fields are at PRODUCTION values on purpose: KD replays its dump by step index
# and hard-exits 43 on a per-step labels_sum mismatch, so shrinking the data breaks the KD path.
TRAIN_USERS_START = 1
TRAIN_USERS_END = 5000
VALIDATE_USERS_START = 5001
VALIDATE_USERS_END = 5010

TRAIN_DATASET_LMDB_PATH = "train_db_5k_h1"
TRAIN_DATASET_LMDB_SIZE = 400_000_000_000
VALIDATE_DATASET_LMDB_PATH = "F:/rwkv_lmdb/test_db_5k"
VALIDATE_DATASET_LMDB_SIZE = 250_000_000_000
LABEL_FILTER_LMDB_PATH = "label_filter_db"
LABEL_FILTER_LMDB_SIZE = 40_000_000_000

NUM_FETCH_PROCESSES = 2
MAX_TRAIN_GLOBAL_LEN = 65536

TRAIN_MODE = "WS"
STEP_OFFSET = 1
# scaled with EPOCHS: 400 of 546 steps would be 73% warmup, so the LR would never plateau
WARMUP_STEPS = 20
EPOCHS = 0.05
# MUST be < the step count or the validation path never executes and the run looks green anyway
VALIDATE_EVERY = 200
PEAK_LR = 1e-3

LOAD_MODEL = false
SAVE_MODEL_FOLDER = "scratchpad/bughunt/diag_base"
SAVE_MODEL_PREFIX = "base_ws"
DEVICE = "cuda"
DTYPE = "bfloat16"


# ITER 54 = LEARNABLE CHANNEL-MIXER EXPONENT (RWKV_CMIX_POW=1), on the iter-45 CHAMPION recipe.
# Clone of scratchpad/iter45_kddecay/i45_ws.toml with ONLY the save folder and prefix changed --
# the lever is entirely in the .cmd's env (13 scalars, one per block).
# ⚠ Data-affecting fields (db, users, MAX_TRAIN_GLOBAL_LEN, fetch processes) MUST stay identical
# to the t128_seedpair_65k dump's: KD replays that dump by step index and its per-step labels_sum
# checksum hard-exits 43 on any divergence. Do not "tidy" them.
# (Written 2026-08-17: mk54.py generated the runner but never this file, so the WS phase would
# have died on a missing config. Same omission as iter 53's.)
TRAIN_USERS_START = 1
TRAIN_USERS_END = 5000
VALIDATE_USERS_START = 5001
VALIDATE_USERS_END = 5010

TRAIN_DATASET_LMDB_PATH = "train_db_5k_h1"
TRAIN_DATASET_LMDB_SIZE = 400_000_000_000
VALIDATE_DATASET_LMDB_PATH = "F:/rwkv_lmdb/test_db_5k"
VALIDATE_DATASET_LMDB_SIZE = 250_000_000_000
LABEL_FILTER_LMDB_PATH = "label_filter_db"
LABEL_FILTER_LMDB_SIZE = 40_000_000_000

NUM_FETCH_PROCESSES = 2
MAX_TRAIN_GLOBAL_LEN = 65536

TRAIN_MODE = "WS"
STEP_OFFSET = 8001
WARMUP_STEPS = 400
EPOCHS = 1
VALIDATE_EVERY = 1000
PEAK_LR = 1e-3

LOAD_MODEL = true
SAVE_MODEL_FOLDER = "scratchpad/iter54_cmixpow"
SAVE_MODEL_PREFIX = "i54_ws"
DEVICE = "cuda"
DTYPE = "bfloat16"

USE_WANDB = false
WANDB_PROJECT_NAME = "rwkv"
WANDB_RESUME = false
WANDB_RESUME_ID = ""

# appended by make_resume.py -- absent from i54_ws.toml
LOAD_MODEL_FOLDER = "scratchpad/iter54_cmixpow"
LOAD_MODEL_NAME = "i54_ws_8000"
